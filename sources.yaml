version: 1
sources:
  - id: local-host-data
    type: local
    container_mount: /host-data
    retention:
      ttl_days: 90
  # SFTP — sensitive fields use env:VAR; vars are prefixed by source id (see .env.example).
  - id: win-home-laptop
    type: sftp
    host: env:WIN_HOME_LAPTOP_HOST
    port: 22
    user: env:WIN_HOME_LAPTOP_USER
    remote_root: env:WIN_HOME_LAPTOP_REMOTE_ROOT
    retention:
      ttl_days: 90
    ssh:
      secret_ref: WIN_HOME_LAPTOP_SSH_KEY
      known_hosts_policy: pinned
      host_key_fingerprint: env:WIN_HOME_LAPTOP_HOST_KEY_FINGERPRINT
    # Directory drill under remote_root (e.g. D:/Karthik/cosmosbdr_data/dir-backup-test).
    # On Windows, create sample layout:
    #   dir-backup-test/baseline.txt
    #   dir-backup-test/docs/guide.pdf
    #   dir-backup-test/logs/app.log
    #   dir-backup-test/nested/deep/beyond-depth.txt   # depth 3 — matched job uses max_depth: 2
    #   dir-backup-test/scratch/temp.tmp               # excluded (glob + regex on all job)
    #   dir-backup-test/excluded/skip.txt              # excluded on matched job
    schedules:
      - id: win-dir-test-all-30m
        relative_path: dir-backup-test
        schedule: "*/30 * * * *"
        enabled: false
        directory:
          selection: all
          exclude:
            - type: glob
              pattern: "**/*.tmp"
            - type: glob
              pattern: "**/~$*"
            - type: regex
              pattern: '^scratch/.*'
      - id: win-dir-test-matched-30m
        relative_path: dir-backup-test
        schedule: "*/30 * * * *"
        enabled: false
        directory:
          selection: matched
          include:
            - type: glob
              pattern: "**/*.txt"
            - type: glob
              pattern: "**/*.pdf"
            - type: regex
              pattern: '^logs/.*\.log$'
          exclude:
            - type: glob
              pattern: "excluded/**"
            - type: regex
              pattern: '^nested/.*'
          max_depth: 2
          min_file_bytes: 1
          max_file_bytes: 10485760
  # OVH (Linux over SSH/SFTP): pg_dump on the VM, then backup dump under remote_root.
  # Single-file jobs only on this source_id (pre_backup runs before every backup).
  - id: ovhcloud-db
    type: sftp
    host: env:OVHCLOUD_DB_HOST
    port: 22
    user: env:OVHCLOUD_DB_USER
    remote_root: env:OVHCLOUD_DB_REMOTE_ROOT
    retention:
      ttl_days: 90
    ssh:
      password_ref: OVHCLOUD_DB_SSH_PASSWORD
      known_hosts_policy: pinned
      host_key_fingerprint: env:OVHCLOUD_DB_HOST_KEY_FINGERPRINT
    # Postgres runs in Docker on the VPS (madume-postgres-1); dump to a host path under remote_root.
    pre_backup:
      command:
        - bash
        - -lc
        - mkdir -p /home/ubuntu/backups/cosmosbdr/db && docker exec -e PGPASSWORD="$PGPASSWORD" madume-postgres-1 pg_dump -Fc -U madume -d madume > /home/ubuntu/backups/cosmosbdr/db/nightly.dump
      env_refs:
        PGPASSWORD: OVHCLOUD_DB_PG_PASSWORD
      output:
        relative_path: db/nightly.dump
        cleanup_after: true
    schedules:
      - id: ovhcloud-pg-manual-test
        relative_path: db/nightly.dump
        schedule: "0 3 * * *"
        enabled: false