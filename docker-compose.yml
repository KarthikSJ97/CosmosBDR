services:
  postgres:
    image: postgres:15-alpine
    container_name: cosmosbdr_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-cosmosbdr}
    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USERNAME:-postgres} -d ${POSTGRES_DB_NAME:-cosmosbdr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: cosmosbdr_seaweedfs
    command: "server -s3 -filer -dir=/data -s3.port=8333 -master.port=9333 -filer.port=8888"
    environment:
      - AWS_ACCESS_KEY_ID=${SEAWEED_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${SEAWEED_SECRET_KEY}
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweeddata:/data

  cadence:
    image: ubercadence/server:master-auto-setup
    container_name: cosmosbdr_cadence
    ports:
      - "${CADENCE_GRPC_PORT:-7933}:7933"
      - "7833:7833" # <-- Ensure port 7833 is exposed for the Web UI gRPC connection
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${POSTGRES_DB_USERNAME:-postgres}
      - POSTGRES_PWD=${POSTGRES_DB_PASSWORD:-postgres}
      - DBNAME=cadence
      - VISIBILITY_DBNAME=cadence_visibility
    depends_on:
      postgres:
        condition: service_healthy

  cadence-web:
    image: ubercadence/web:latest
    container_name: cosmosbdr_cadence_web
    ports:
      - "${CADENCE_UI_PORT:-8088}:8088"
    volumes:
      - ./cadence-web-config.json:/etc/cadence-web/config/development.json # <-- Mounts your file into the container
    environment:
      - CADENCE_GRPC_PEERS=cadence:7833
      - CADENCE_HISTORY_PAGE_V2_ENABLED=OPT_OUT
    depends_on:
      - cadence

  cadence-register-domain:
    image: ubercadence/cli:master
    container_name: cosmosbdr_domain_migrator
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Cadence to start..."
        while ! nc -z cadence 7933 2>/dev/null; do
          sleep 1
        done
        echo "Cadence is up! Registering domain..."
        cadence --address cadence:7933 --domain samples-domain domain register || echo "Domain already exists, continuing..."
    depends_on:
      - cadence

  atlas-migrate:
    image: arigaio/atlas:latest
    container_name: cosmosbdr_migrator
    volumes:
      - ./src/db/migrations:/migrations
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://postgres:postgres@postgres:5432/cosmosbdr?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy    

  cosmosbdr:
    build: .
    container_name: cosmosbdr_app
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - POSTGRES_DB_HOST=postgres
      - SEAWEED_ENDPOINT=http://seaweedfs:8333
      - CADENCE_GRPC_HOST=cadence
      - CADENCE_GRPC_PORT=7933
    depends_on:
      postgres:
        condition: service_healthy
      atlas-migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
      cadence:
        condition: service_started
      cadence-register-domain:
        condition: service_completed_successfully

volumes:
  pgdata:
  seaweeddata: